<!-- =========================================================
     SELEÇÃO DE BOSS
========================================================= -->
<div class="boss-selector">

  <button data-boss-id="hraesvelgr" class="ativo">
    🦅 Hræsvelgr
  </button>

  <button data-boss-id="skoll">
    ☀️ Skoll
  </button>

  <button data-boss-id="hati">
    🌑 Hati
  </button>

  <button data-boss-id="mordrax">
    ⛰️ Mórdrax
  </button>

</div>


<!-- =========================================================
     SELEÇÃO DE NÍVEL
========================================================= -->
<div class="boss-level-selector">

  <span class="level-selector-title">
    NÍVEL DO BOSS
  </span>

  <button data-level="12" class="ativo">
    12
  </button>

  <button data-level="100">
    100
  </button>

  <button data-level="200">
    200
  </button>

  <button data-level="300">
    300
  </button>

  <button data-level="400">
    400
  </button>

</div>


<!-- =========================================================
     CARD DO BOSS
========================================================= -->
<div
  class="boss-card dimension affinity-terra"
  id="boss-card"
>

  <!-- CABEÇALHO -->
  <div class="boss-header">

    <div class="boss-title-area">

      <h2 id="boss-name">
        Hræsvelgr
      </h2>

      <span
        class="boss-level"
        id="boss-level"
      >
        NÍVEL 12 · VENTO
      </span>

    </div>

    <span
      class="boss-affinity"
      id="boss-affinity"
    >
      VENTO
    </span>

  </div>


  <!-- =======================================================
       IMAGEM
  ======================================================== -->
  <div class="boss-image-area">

    <img
      src=""
      alt="Boss"
      class="boss-image"
      id="boss-image"
      loading="lazy"
    >

  </div>


  <!-- =======================================================
       RECURSOS
  ======================================================== -->
  <div class="boss-resources">

    <!-- HP -->
    <div class="boss-resource">

      <div class="resource-header">

        <span>VIDA</span>

        <span id="hp-text">
          0 / 0
        </span>

      </div>

      <div class="resource-bar">

        <div
          class="resource-fill"
          id="boss-hp"
          style="width: 100%"
        ></div>

      </div>

    </div>


    <!-- MP -->
    <div class="boss-resource">

      <div class="resource-header">

        <span>ALMA</span>

        <span id="mp-text">
          0 / 0
        </span>

      </div>

      <div class="resource-bar">

        <div
          class="resource-fill"
          id="boss-mp"
          style="width: 100%"
        ></div>

      </div>

    </div>


    <!-- EST -->
    <div class="boss-resource">

      <div class="resource-header">

        <span>FORÇA</span>

        <span id="est-text">
          0 / 0
        </span>

      </div>

      <div class="resource-bar">

        <div
          class="resource-fill"
          id="boss-est"
          style="width: 100%"
        ></div>

      </div>

    </div>

  </div>


  <!-- =======================================================
       STATUS
  ======================================================== -->
  <div class="boss-stats">

    <div class="boss-stat">

      <span class="boss-stat-label">
        ATAQUE
      </span>

      <span
        class="boss-stat-value"
        id="boss-atk"
      >
        0
      </span>

    </div>


    <div class="boss-stat">

      <span class="boss-stat-label">
        DEFESA
      </span>

      <span
        class="boss-stat-value"
        id="boss-def"

        0
      </span>

    </div>


    <div class="boss-stat">

      <span class="boss-stat-label">
        VELOCIDADE
      </span>

      <span
        class="boss-stat-value"
        id="boss-spd"
      >
        0
      </span>

    </div>

  </div>


  <!-- =======================================================

  ======================================================== -->
  <div class="boss-section">

    <h3 class="boss-section-title">

  </div>
