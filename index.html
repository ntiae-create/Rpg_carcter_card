<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RPG Character Cards</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="app-header">
            <h1>RPG Character Cards</h1>
            <p>Crie e evolua seus personagens.</p>
        </header>

        <section class="character-card">

            <div class="card-header">
                <span class="rarity">✦ RARO ✦</span>
                <span class="level">LV. 01</span>
            </div>

            <div class="character-image">
                <span>ARTE DO PERSONAGEM</span>
            </div>

            <div class="character-info">

    <h2>Nome do Personagem</h2>
    <p class="title">Título / Epíteto</p>

    <div class="character-selection">

        <label for="race-select">Raça</label>

        <select id="race-select">
            <option value="humano">Humano</option>
            <option value="meioElfo">Meio-elfo</option>
            <option value="elfo">Elfo</option>
            <option value="semiBesta">Semi-besta</option>
            <option value="besta">Besta</option>
        </select>

    </div>

                <div class="xp-section">
                    <div class="xp-info">
                        <span>XP</span>
                        <span>0 / 100</span>
                    </div>

                    <div class="xp-bar">
                        <div class="xp-progress"></div>
                    </div>
                </div>

                <div class="stats">

    <div class="stat">
        <span>⚔️</span>
        <strong id="stat-atk">4</strong>
        <small>ATK</small>
    </div>

    <div class="stat">
        <span>🛡️</span>
        <strong id="stat-def">8</strong>
        <small>DEF</small>
    </div>

    <div class="stat">
        <span>⚡</span>
        <strong id="stat-agi">8</strong>
        <small>AGI</small>
    </div>

    <div class="stat">
        <span>🧠</span>
        <strong id="stat-int">15</strong>
        <small>INT</small>
    </div>

  </div>

                <div class="badges">
                    <h3>BRASÕES</h3>

                    <div class="badge-list">
                        <div class="badge locked">?</div>
                        <div class="badge locked">?</div>
                        <div class="badge locked">?</div>
                        <div class="badge locked">?</div>
                    </div>
                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
